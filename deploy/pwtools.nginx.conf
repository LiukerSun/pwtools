server {
    listen 80;
    listen [::]:80;
    server_name pwtools.liukersun.com;
    location ^~ /.well-known/acme-challenge/ {
        root /www/sites/pwtools.liukersun.com/acme;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pwtools.liukersun.com;
    ssl_certificate /www/sites/pwtools.liukersun.com/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/pwtools.liukersun.com/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8187;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # This vhost uses DNS-only Cloudflare records. Ignore user-supplied IP headers.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 100s;
        proxy_send_timeout 100s;
        add_header Cache-Control "no-store" always;
    }
    location / { return 404; }
}
